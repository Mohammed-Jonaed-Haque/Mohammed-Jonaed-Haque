<svg width="220" height="220" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Animated profile avatar for Mohammed Jonaed Haque</title>
  <style>
    .ring {
      transform-origin: 110px 110px;
      animation: spin 4s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>

  <defs>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d1ff"/>
      <stop offset="100%" stop-color="#7b2ff7"/>
    </linearGradient>
    <clipPath id="photoClip">
      <circle cx="110" cy="110" r="88"/>
    </clipPath>
  </defs>

  <image href="https://avatars.githubusercontent.com/u/226615645?v=4"
         x="22" y="22" width="176" height="176"
         clip-path="url(#photoClip)" preserveAspectRatio="xMidYMid slice"/>

  <circle class="ring" cx="110" cy="110" r="96" fill="none" stroke="url(#ringGrad)"
          stroke-width="5" stroke-linecap="round" stroke-dasharray="420 180"/>

  <circle cx="110" cy="110" r="88" fill="none" stroke="#30363d" stroke-width="1"/>
</svg>
